name: atarah
description: "Atarah — Create · Connect · Grow"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  connectivity_plus: ^7.3.2
  crop_your_image: ^2.0.1
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.2.0
  freezed_annotation: ^3.1.0
  geocoding: ^5.0.0
  geolocator: ^14.0.1
  go_router: ^18.1.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^4.0.0
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.7
  sentry_flutter: ^10.1.0
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.12
  swagger_parser: ^1.45.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/brand/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# App identity (P1-M7). Regenerate with: dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: assets/launcher/atarah-app-icon-light-square-fullbleed-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/launcher/atarah-adaptive-foreground-432.png

flutter_native_splash:
  color: '#17153F'
  image: assets/launcher/atarah-splash-symbol.png
  android_12:
    color: '#17153F'
    image: assets/launcher/atarah-splash-symbol.png
  ios: true
  android: true
  web: false
  fullscreen: false
