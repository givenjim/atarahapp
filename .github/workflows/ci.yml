name: CI

# Pipeline definition only: the owner pushes it. It has not been executed on GitHub, so treat the first run as
# the real test of the YAML. Every command below was run locally by the same name (see docs/DEVELOPMENT.md).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Dev-only values for the CI containers. They are not secrets and never leave the runner.
  ATARAH_ENV: test
  CI: 'true'

jobs:
  repo-checks:
    name: Brand check and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Brand check
        run: node scripts/check-brand.mjs
      - name: Colour check (no pre-v2.3 palette)
        run: node scripts/check-colors.mjs
      - name: Secret scan (gitleaks, working tree)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --no-banner --redact

  node:
    name: Lint, typecheck, test and build (backend, web, admin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Placeholders so the OpenAPI export can load the app configuration. Nothing connects to them.
      ATARAH_DATABASE_URL: postgresql://atarah_backend:unused@localhost:55322/postgres
      ATARAH_REDIS_URL: redis://localhost:56379
      ATARAH_SUPABASE_URL: http://127.0.0.1:55321
      ATARAH_SUPABASE_SECRET_KEY: ci-placeholder-secret-key-not-used
      ATARAH_SEND_SMS_HOOK_SECRET: v1,whsec_Y2ktcGxhY2Vob2xkZXItaG9vay1zZWNyZXQtMDAwMDAwMDA=
      ATARAH_PUBLIC_URL: http://localhost:3000
      ATARAH_CORS_ORIGINS: http://localhost:3200
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start the local Supabase stack (Auth, Postgres, Storage, Realtime, mail catcher)
        run: |
          cp supabase/.env.example supabase/.env
          SECRET="v1,whsec_$(node -e "console.log(require('crypto').randomBytes(36).toString('base64'))")"
          sed -i "s|^SEND_SMS_HOOK_SECRET=.*|SEND_SMS_HOOK_SECRET=${SECRET}|" supabase/.env
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: pnpm --filter @atarah/backend db:generate
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Contract is up to date
        run: |
          pnpm gen:api
          git diff --exit-code packages/api-contracts
      - name: Test (backend integration tests run against the local Supabase stack and Redis)
        run: pnpm test
      - name: Row Level Security check
        run: node scripts/check-rls.mjs
      - name: Build
        run: pnpm build
      - name: Upload builds for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: builds
          retention-days: 1
          path: |
            apps/backend/dist
            apps/admin/.next
            apps/web/.next

  admin-e2e:
    name: Admin Playwright flow
    runs-on: ubuntu-latest
    needs: node
    timeout-minutes: 40
    services:
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start the local Supabase stack
        run: |
          cp supabase/.env.example supabase/.env
          SECRET="v1,whsec_$(node -e "console.log(require('crypto').randomBytes(36).toString('base64'))")"
          sed -i "s|^SEND_SMS_HOOK_SECRET=.*|SEND_SMS_HOOK_SECRET=${SECRET}|" supabase/.env
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: pnpm --filter @atarah/backend db:generate
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: .
      - name: Backend environment, migrate and seed
        run: |
          node scripts/supabase-env.mjs
          pnpm --filter @atarah/backend db:migrate:deploy
          pnpm --filter @atarah/backend db:provision
          pnpm --filter @atarah/backend db:seed
      - name: Start the backend
        working-directory: apps/backend
        run: |
          nohup node --env-file=.env dist/main.js > backend.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3000/health/live && break; sleep 2; done
      - name: Install Chromium
        working-directory: apps/admin
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/admin
        run: pnpm e2e
      - name: Backend log on failure
        if: failure()
        run: cat apps/backend/backend.log
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/admin/test-results

  flutter:
    name: Flutter analyze, test and Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date and formatted
        run: |
          dart run swagger_parser
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib test integration_test
          git diff --exit-code .
      - run: flutter analyze
      - run: flutter test
      - name: Android debug build (dev flavour)
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
