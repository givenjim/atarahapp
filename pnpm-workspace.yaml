packages:
  - 'apps/backend'
  - 'apps/web'
  - 'apps/admin'
  - 'packages/*'

# pnpm 12 blocks dependency install scripts unless explicitly allowed. Keep this list minimal.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  '@scarf/scarf': false
  '@parcel/watcher': true
  unrs-resolver: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  '@firebase/util': false
