# Local development services for Atarah that Supabase does not provide.
# PostgreSQL, Auth, Storage, Realtime and the mail catcher run from the Supabase CLI stack (`supabase/config.toml`,
# started by `just infra-up`). This file is Redis only (cache, rate limits, BullMQ).
# The host port is offset (56379) so Atarah can run beside other local projects that use the default port.
name: atarah

services:
  redis:
    image: redis:7-alpine
    container_name: atarah-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '56379:6379'
    volumes:
      - atarah-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  atarah-redis-data:
