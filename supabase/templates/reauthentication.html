<!doctype html>
<html>
  <body
    style="
      margin: 0;
      background: #f6f5fc;
      font-family: Arial, Helvetica, sans-serif;
      color: #17153f;
    "
  >
    <div style="max-width: 480px; margin: 0 auto; padding: 32px 22px">
      <div style="background: #fff; border-radius: 18px; padding: 28px">
        <p style="font-weight: 800; font-size: 20px; margin: 0 0 6px; color: #5145d8">Atarah</p>
        <h1 style="font-size: 22px; margin: 0 0 12px">Confirm it is you</h1>
        <p style="font-size: 15px; line-height: 1.6; color: #4a4868; margin: 0 0 20px">
          Enter this code in Atarah to confirm this change.
        </p>
        <p
          style="
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 8px;
            margin: 0 0 20px;
            color: #17153f;
          "
        >
          {{ .Token }}
        </p>
        <p style="font-size: 13px; line-height: 1.6; color: #77758f; margin: 0">
          If you did not ask for this, you can ignore this email. Atarah will never ask you for this
          code.
        </p>
      </div>
    </div>
  </body>
</html>
